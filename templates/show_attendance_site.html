<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Show Attendance</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    background: #07111f;

    color: white;

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

}

.container {

    width: 90%;

    max-width: 1000px;

    text-align: center;

}

h1 {

    font-size: 38px;

    margin-bottom: 10px;

}

.subtitle {

    color: #9fb0c5;

    margin-bottom: 45px;

}

.sites {

    display: flex;

    justify-content: center;

    gap: 25px;

    flex-wrap: wrap;

}

.site-button {

    width: 250px;

    height: 150px;

    background: #0d1b2d;

    border: 1px solid #263a52;

    border-radius: 16px;

    color: white;

    text-decoration: none;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    transition: 0.25s;

}

.site-button:hover {

    transform: translateY(-5px);

    background: #12263d;

    border-color: #4da3ff;

}

.icon {

    font-size: 42px;

    margin-bottom: 12px;

}

.site-name {

    font-size: 22px;

    font-weight: bold;

}

.back {

    display: inline-block;

    margin-top: 45px;

    padding: 11px 22px;

    background: #39495c;

    color: white;

    text-decoration: none;

    border-radius: 8px;

}

.back:hover {

    background: #4d5f73;

}

</style>

</head>


<body>


<div class="container">


<h1>

📊 SHOW ATTENDANCE

</h1>


<div class="subtitle">

Select Site

</div>


<div class="sites">


{% for site in sites %}


<a
    href="/show-attendance/{{ site }}"
    class="site-button"
>


<div class="icon">

🏭

</div>


<div class="site-name">

{{ site }}

</div>


</a>


{% endfor %}


</div>


<a
    href="/"
    class="back"
>

← HOME

</a>


</div>


</body>

</html>
